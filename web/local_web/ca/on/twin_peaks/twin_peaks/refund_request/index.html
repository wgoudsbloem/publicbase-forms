<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/base.css" rel="stylesheet">
    <script src="/base.js" defer></script>
    <title>Refund Request</title>

</head>

<body>
    <div class="card">
        <h1>Refund Request</h1>
        <p>Request a refund for a municipal fee/payment (where permitted).</p>
        <form><label>Requester first name<input type="text" name="first_name" /></label>
            <label>Requester last name<input type="text" name="last_name" /></label>
            <label>Requester email<input type="email" name="email" /></label>
            <label>Refund type<select name="refund_type">
                    <option value="Permit fee">Permit fee</option>
                    <option value="Program fee">Program fee</option>
                    <option value="Overpayment">Overpayment</option>
                    <option value="Other">Other</option>
                </select></label>
            <label>Amount requested<input type="currency" name="amount_requested" /></label>
            <label>Payment date<input type="date" name="payment_date" /></label>
            <label>Reason for refund<textarea name="reason"></textarea></label>
            <label>Declaration<input type="checkbox" name="terms_ack" /></label>
        </form>
    </div>
</body>

</html>

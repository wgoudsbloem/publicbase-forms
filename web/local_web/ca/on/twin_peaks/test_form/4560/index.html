<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="/base.css" rel="stylesheet" />
        <script src="/base.js" defer></script>
        <title>Test form</title>
    </head>

    <body>
        <main>
            <header>
                <h1>Test form</h1>
                <p>This form is to test all input fields and it also includes the full contact form</p>
            </header>
            <form autocomplete="off">
                <section>
                    <fieldset>
                        <label><span>First name</span><input type="text" name="first_name" required /></label>
                        <label><span>Last name</span><input type="text" name="last_name" required /></label>
                        <label><span>Phone</span><input type="text" name="phone" placeholder="555-123-4567" required /></label>
                        <label><span>Email</span><input type="email" name="email" placeholder="you@example.com" /></label>
                        <div class="field-group">
                            <span>Preferred contact*</span>
                            <label>
                                <input type="radio" name="preference" value="PHONE" required />
                                Phone
                            </label>
                            <label>
                                <input type="radio" name="preference" value="EMAIL" required />
                                Email
                            </label>
                        </div>
                        <label><span>Address line 1</span><input type="text" name="address_1" placeholder="123 Main St" required /></label>
                        <label><span>Address line 2</span><input type="text" name="address_2" placeholder="Unit, suite, apt" /></label>
                        <label><span>City</span><input type="text" name="city" required /></label>
                        <label><span>State / Province</span><input type="text" name="state" required /></label>
                        <label><span>ZIP / Postal code</span><input type="text" name="zip" required /></label>
                        <label><span>Test text</span><input type="text" name="test_text" placeholder="test placeholder" required /></label>
                        <label><span>Extra email</span><input type="email" name="extra_email" placeholder="you@example.com" required /></label>
                        <label><span>Test number</span><input type="number" name="test_number" placeholder="between 100 and 300" required min="100" max="300" value="200" /></label>
                        <label><span>Test date</span><input type="date" name="test_date" required /></label>
                        <label><span>Test currency</span><input type="number" name="test_currency" placeholder="$100" required step="0.01" /></label>
                        <label>
                            <span>Test long text</span>
                            <textarea name="test_long_text" rows="4" required></textarea>
                        </label>
                        <label>
                            <span>Test dropdown</span>
                            <select name="test_dropdown" required>
                                <option value="">Select an option</option>
                                <option value="Dog">Dog</option>
                                <option value="Cat" selected>Cat</option>
                                <option value="Rabbit">Rabbit</option>
                            </select>
                        </label>
                        <div class="field-group">
                            <span>Test radio*</span>
                            <label>
                                <input type="radio" name="test_radio" value="Yes" required />
                                Yes
                            </label>
                            <label>
                                <input type="radio" name="test_radio" value="No" required />
                                No
                            </label>
                            <label>
                                <input type="radio" name="test_radio" value="Maybe so" required checked />
                                Maybe so
                            </label>
                        </div>
                        <label>
                            <input type="checkbox" name="test_check" value="true" required />
                            <span>Test check</span>
                        </label>
                    </fieldset>
                </section>
                <button id="submit-btn" type="submit">Submit request</button>
            </form>
        </main>
    </body>

</html>

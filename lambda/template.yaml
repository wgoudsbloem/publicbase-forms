AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PublicBase forms API lambdas
  
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        DB_NAME: publicbase
        DB_PORT: "5432"
        DB_SSL: "true"

Parameters:
  ResourceSuffix:
    Type: String
    Default: ""
    Description: Suffix for named resources. Use empty for prod, "-dev" for dev.
  PublicHttpApiId:
    Type: String
    Default: 83t8t7jr53
    Description: HTTP API ID for the existing public-api in API Gateway v2.
  AdminLambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0612f82330f2556e3
    Description: Lambda security group allowed to access the database.
  VpcId:
    Type: String
    Default: vpc-0e1bcb950b659598f
    Description: VPC ID used for the form Lambda.
  LambdaSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-0abbfe68915116e61,subnet-0ae9dc1c8a4178603,subnet-0fbef6d62eb305688
    Description: Subnets for the form Lambda VPC config.
  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for the existing publicbase database.
  DbHost:
    Type: String
    Description: Database host for publicbase.
  AltchaHmacSecretName:
    Type: String
    Default: forms-altcha-hmac-key
    Description: Secrets Manager secret name storing the ALTCHA HMAC key.
  DbSecretName:
    Type: String
    Default: admin-db-credentials
    Description: Secrets Manager secret name storing database credentials.
  FormCodesTableName:
    Type: String
    Default: form_codes
    Description: DynamoDB table name for temporary form codes.
  FormUploadBucket:
    Type: String
    Default: publicbase-files
    Description: S3 bucket used for public form file uploads.
  FormUploadTokenSecretName:
    Type: String
    Default: forms-upload-token-key
    Description: Secrets Manager secret name storing the public upload token HMAC key.
  SubmissionEmailTopicName:
    Type: String
    Default: admin-submission-email
    Description: SNS topic name for submission notification email fan-out.

Resources:

  FormCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref FormCodesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AdminLambdaSecurityGroup:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /publicbase/forms${ResourceSuffix}/admin-lambda-sg
      Type: String
      Value: !Ref AdminLambdaSecurityGroupId

  FormPost:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub form-post${ResourceSuffix}
      CodeUri: form-post/
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          FORM_CODES_TABLE: !Ref FormCodesTable
          DEBUG: "true"
          DDB_REQUEST_TIMEOUT_MS: "2000"
          SNS_REQUEST_TIMEOUT_MS: "8000"
          LAMBDA_INVOKE_TIMEOUT_MS: "5000"
          SUBMISSION_EMAIL_TOPIC_ARN: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${SubmissionEmailTopicName}
          FORM_POST_STORE_FUNCTION_NAME: !Ref FormPostStore
          ALTCHA_HMAC_KEY: !Sub "{{resolve:secretsmanager:${AltchaHmacSecretName}:SecretString}}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FormCodesTable
        - LambdaInvokePolicy:
            FunctionName: !Ref FormPostStore
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${SubmissionEmailTopicName}

  FormPostStore:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub form-post-store${ResourceSuffix}
      CodeUri: form-post-store/
      Handler: index.handler
      Timeout: 10
      VpcConfig:
        SecurityGroupIds:
          - !Ref AdminLambdaSecurityGroupId
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_USER: !Sub "{{resolve:secretsmanager:${DbSecretName}:SecretString:username}}"
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbSecretName}:SecretString:password}}"
          DEBUG: "true"
          DB_CONNECT_TIMEOUT_MS: "3000"
          DB_QUERY_TIMEOUT_MS: "3000"

  FormUploadGrant:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub form-upload-grant${ResourceSuffix}
      CodeUri: form-upload-grant/
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          FORM_CODES_TABLE: !Ref FormCodesTable
          FORM_UPLOAD_BUCKET: !Ref FormUploadBucket
          FORM_UPLOAD_TOKEN_SECRET: !Sub "{{resolve:secretsmanager:${FormUploadTokenSecretName}:SecretString}}"
          ALTCHA_HMAC_KEY: !Sub "{{resolve:secretsmanager:${AltchaHmacSecretName}:SecretString}}"
          DEBUG: "true"
          DDB_REQUEST_TIMEOUT_MS: "2000"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FormCodesTable

  FormUploadPost:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub form-upload-post${ResourceSuffix}
      CodeUri: form-upload-post/
      Handler: index.handler
      Timeout: 15
      Environment:
        Variables:
          FORM_UPLOAD_BUCKET: !Ref FormUploadBucket
          FORM_UPLOAD_TOKEN_SECRET: !Sub "{{resolve:secretsmanager:${FormUploadTokenSecretName}:SecretString}}"
          S3_REQUEST_TIMEOUT_MS: "8000"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:AbortMultipartUpload
                - s3:ListMultipartUploadParts
                - s3:PutObject
              Resource: !Sub arn:aws:s3:::${FormUploadBucket}/*

  FormChallengeGet:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub form-challenge-get${ResourceSuffix}
      CodeUri: form-challenge-get/
      Handler: index.handler
      Timeout: 10
      Environment:
        Variables:
          FORM_CODES_TABLE: !Ref FormCodesTable
          DEBUG: "true"
          DDB_REQUEST_TIMEOUT_MS: "2000"
          ALTCHA_HMAC_KEY: !Sub "{{resolve:secretsmanager:${AltchaHmacSecretName}:SecretString}}"
          ALTCHA_MAX_NUMBER: "50000"
          ALTCHA_EXPIRE_SECONDS: "300"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FormCodesTable

  FormCodeGet:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub form-code-get${ResourceSuffix}
      CodeUri: form-code-get/
      Handler: index.handler
      Timeout: 10
      VpcConfig:
        SecurityGroupIds:
          - !Ref AdminLambdaSecurityGroupId
        SubnetIds: !Ref LambdaSubnetIds
      Environment:
        Variables:
          FORM_CODES_TABLE: !Ref FormCodesTable
          DEBUG: "true"
          DDB_REQUEST_TIMEOUT_MS: "2000"
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref FormCodesTable

  PublicHttpApiFormCodeGetIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PublicHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FormCodeGet.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  PublicHttpApiFormCodeGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PublicHttpApiId
      RouteKey: "GET /form/code"
      Target: !Sub "integrations/${PublicHttpApiFormCodeGetIntegration}"

  PublicHttpApiFormCodeGetPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FormCodeGet
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApiId}/*/GET/form/code"

  PublicHttpApiFormPostIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PublicHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FormPost.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  PublicHttpApiFormPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PublicHttpApiId
      RouteKey: "POST /form"
      Target: !Sub "integrations/${PublicHttpApiFormPostIntegration}"

  PublicHttpApiFormPostPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FormPost
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApiId}/*/POST/form"

  PublicHttpApiFormUploadGrantIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PublicHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FormUploadGrant.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  PublicHttpApiFormUploadGrantRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PublicHttpApiId
      RouteKey: "POST /form/upload/grant"
      Target: !Sub "integrations/${PublicHttpApiFormUploadGrantIntegration}"

  PublicHttpApiFormUploadGrantPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FormUploadGrant
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApiId}/*/POST/form/upload/grant"

  PublicHttpApiFormUploadPostIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PublicHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FormUploadPost.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  PublicHttpApiFormUploadPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PublicHttpApiId
      RouteKey: "POST /form/upload"
      Target: !Sub "integrations/${PublicHttpApiFormUploadPostIntegration}"

  PublicHttpApiFormUploadPostPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FormUploadPost
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApiId}/*/POST/form/upload"

  PublicHttpApiFormChallengeGetIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref PublicHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FormChallengeGet.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  PublicHttpApiFormChallengeGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref PublicHttpApiId
      RouteKey: "GET /form/challenge"
      Target: !Sub "integrations/${PublicHttpApiFormChallengeGetIntegration}"

  PublicHttpApiFormChallengeGetPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FormChallengeGet
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PublicHttpApiId}/*/GET/form/challenge"
